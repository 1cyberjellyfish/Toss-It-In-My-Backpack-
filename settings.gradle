pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.kikugie.dev/snapshots' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    create(rootProject) {
        def targetVersions = ["1.21.1-fabric", "1.21.1-neoforge"]
        if (JavaVersion.current().isCompatibleWith(JavaVersion.toVersion(25)) || Boolean.getBoolean("enable26")) {
            targetVersions.addAll(["26.2-fabric", "26.2-neoforge"])
        }
        versions(targetVersions as String[])
        vcsVersion = "1.21.1-neoforge"
    }
}


